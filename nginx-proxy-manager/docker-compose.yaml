services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    environment:
      - DB_SQLITE_FILE=/data/database.sqlite
      - DISABLE_IPV6=false
      - NPM_PORT=81    # 将管理端口改为 81
    volumes:
      - ${DATA_PATH}/data:/data
      - ${DATA_PATH}/letsencrypt:/etc/letsencrypt
    network_mode: host
