services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      # 可选环境变量
      - OLLAMA_HOST=0.0.0.0:11434

volumes:
  ollama: